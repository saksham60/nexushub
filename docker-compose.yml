services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      MCP_SIMPLE_TOOL_URL: http://mcp-server:8010
      MCP_SERVER_URL: http://mcp-server:8010/mcp
    depends_on:
      - mcp-server

  mcp-server:
    build: ./nexushub-mcp-server
    ports:
      - "8010:8010"
    env_file:
      - ./nexushub-mcp-server/.env
    environment:
      NEXUSHUB_MODE: graph
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
      BACKEND_INTERNAL_URL: http://backend:3001
