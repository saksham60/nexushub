[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexushub-mcp-server"
version = "0.1.0"
description = "NexusHub MCP-native server for Microsoft 365 execution workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NexusHub" }]
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.12.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "starlette>=0.37.2,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "isort>=6.0.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
nexushub-mcp = "nexushub_mcp.index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
packages = ["nexushub_mcp"]
